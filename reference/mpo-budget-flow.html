<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MPO · Build plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --gray-0:#FFFFFF; --gray-100:#F8FBFB; --gray-200:#ECEEF0; --gray-300:#E2E6E8;
  --gray-400:#C5CDD2; --gray-500:#8B9AA4; --gray-600:#647986; --gray-700:#516877;
  --gray-800:#3D5768; --gray-900:#203E51; --gray-1000:#0D2D42; --gray-1100:#041723;
  --orange-100:#FFEEE9; --orange-200:#FFDDD2; --orange-400:#FF9879; --orange-600:#FF5420;
  --orange-700:#DD4314; --orange-800:#CB3A0D;
  --blue-100:#ECF2FC; --blue-700:#2F5FBD; --blue-900:#184294;
  --green-300:#B5EBE5; --green-1000:#008B7B;
  --yellow-100:#FFF7EC; --yellow-1000:#8B5300;
  --font:'IBM Plex Sans',Arial,sans-serif; --mono:'IBM Plex Mono',monospace;
  --sh-sm:0 1px 3px 0 rgba(13,45,66,.08),0 1px 2px 0 rgba(13,45,66,.04);
  --sh-md:0 4px 6px -1px rgba(13,45,66,.08),0 2px 4px -1px rgba(13,45,66,.04);
  --sh-lg:0 10px 15px -3px rgba(13,45,66,.1),0 4px 6px -2px rgba(13,45,66,.04);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--gray-900);background:var(--gray-100);
  -webkit-font-smoothing:antialiased;line-height:1.5}
.app{max-width:760px;margin:0 auto;padding:40px 20px 80px}

.card{background:var(--gray-0);border:1px solid var(--gray-300);border-radius:16px;
  box-shadow:var(--sh-sm);overflow:visible}
.card-head{padding:24px 26px 18px;border-bottom:1px solid var(--gray-200)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--orange-600);margin:0 0 7px}
.card-head h1{margin:0 0 6px;font-size:22px;font-weight:600;color:var(--gray-1000);line-height:1.25}
.card-head p{margin:0;font-size:14px;color:var(--gray-700)}
.card-body{padding:22px 26px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 26px;border-top:1px solid var(--gray-200);background:var(--gray-100);border-radius:0 0 16px 16px}

.btn{font-family:var(--font);font-size:14px;font-weight:500;padding:10px 20px;border-radius:8px;
  cursor:pointer;border:1px solid var(--gray-300);background:var(--gray-0);color:var(--gray-900);
  transition:all .16s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--gray-500);background:var(--gray-100)}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--orange-600);border-color:var(--orange-600);color:#fff}
.btn-primary:hover{background:var(--orange-700);border-color:var(--orange-700)}
.btn-primary:disabled{background:var(--gray-300);border-color:var(--gray-300);color:var(--gray-500);cursor:not-allowed;transform:none}
.btn-lg{padding:12px 24px;font-size:15px}

.group-label{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--gray-600);margin:0 0 10px}
.group-label .sub{font-weight:400;letter-spacing:0;text-transform:none;color:var(--gray-500);font-size:12.5px}
.group{margin-bottom:22px}
.group:last-child{margin-bottom:0}
.opt{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--gray-300);
  border-radius:10px;cursor:pointer;margin-bottom:9px;transition:all .16s;background:var(--gray-0)}
.opt:last-child{margin-bottom:0}
.opt:hover{border-color:var(--gray-500);background:var(--gray-100)}
.opt.sel{border-color:var(--orange-600);background:var(--orange-100)}
.opt .mark{width:20px;height:20px;flex-shrink:0;border:1.5px solid var(--gray-400);
  display:flex;align-items:center;justify-content:center;transition:all .16s;color:#fff;font-size:12px}
.opt.radio .mark{border-radius:50%}
.opt.check .mark{border-radius:5px}
.opt.sel .mark{background:var(--orange-600);border-color:var(--orange-600)}
.opt .otext{flex:1}
.opt .otitle{font-size:15px;font-weight:500;color:var(--gray-1000)}
.opt .odesc{font-size:13px;color:var(--gray-600);margin-top:1px}

.methods{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.method{text-align:left;padding:20px;border:1px solid var(--gray-300);border-radius:12px;
  cursor:pointer;background:var(--gray-0);transition:all .16s;font-family:var(--font)}
.method:hover{border-color:var(--orange-600);box-shadow:var(--sh-md);transform:translateY(-1px)}
.micon{width:44px;height:44px;border-radius:11px;background:var(--orange-100);color:var(--orange-700);
  display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.micon svg{width:22px;height:22px}
.method h3{margin:0 0 5px;font-size:16px;font-weight:600;color:var(--gray-1000)}
.method p{margin:0;font-size:13px;color:var(--gray-600);line-height:1.45}

.dropzone{border:1.5px dashed var(--gray-400);border-radius:12px;padding:34px 20px;text-align:center;
  background:var(--gray-100);transition:all .16s;cursor:pointer}
.dropzone:hover{border-color:var(--orange-600);background:var(--orange-100)}
.dropzone.filled{border-style:solid;border-color:var(--green-1000);background:var(--green-300)}
.dz-icon{width:48px;height:48px;margin:0 auto 12px;color:var(--gray-500)}
.dz-icon svg{width:100%;height:100%}
.dropzone.filled .dz-icon{color:var(--green-1000)}
.dz-title{font-size:15px;font-weight:500;color:var(--gray-1000)}
.dz-sub{font-size:13px;color:var(--gray-600);margin-top:3px}
.template-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--gray-300);
  border-radius:10px;margin-bottom:18px;background:var(--blue-100)}
.template-row .ti{width:34px;height:34px;border-radius:8px;background:var(--gray-0);color:var(--blue-700);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.template-row .ti svg{width:18px;height:18px}
.template-row .tt{flex:1}
.template-row .tt strong{font-size:14px;font-weight:600;color:var(--gray-1000);display:block}
.template-row .tt span{font-size:12.5px;color:var(--gray-700)}

.field{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.field:last-child{margin-bottom:0}
.field label{font-size:14px;font-weight:500;color:var(--gray-800);min-width:96px}
.daycount{font-size:13px;color:var(--gray-600);font-family:var(--mono)}
select{font-family:var(--font);font-size:14px;padding:10px 12px;border:1px solid var(--gray-300);
  border-radius:8px;background:var(--gray-0);color:var(--gray-900);cursor:pointer;min-width:230px}
select:focus{outline:none;border-color:var(--orange-600);box-shadow:0 0 0 3px var(--orange-100)}

/* fetch source panel */
.src-panel{border:1px solid var(--gray-300);border-radius:12px;overflow:hidden;margin-bottom:16px}
.period-bar{display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--gray-0);flex-wrap:wrap}
.period-bar .pb-ico{width:30px;height:30px;color:var(--gray-600);flex-shrink:0}
.period-bar .pb-ico svg{width:100%;height:100%}
.period-bar label{font-size:14px;font-weight:600;color:var(--gray-900);min-width:auto}
.period-note{display:flex;gap:9px;align-items:center;padding:12px 20px;background:var(--blue-100);
  color:var(--blue-900);font-size:13.5px;border-top:1px solid var(--gray-300);line-height:1.4}
.period-note svg{width:16px;height:16px;flex-shrink:0;color:var(--blue-700)}

/* upload review file row */
.file-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--gray-300);
  border-radius:12px;margin-bottom:16px;background:var(--gray-0)}
.file-row .ti{width:36px;height:36px;border-radius:8px;background:var(--green-300);color:var(--green-1000);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.file-row .ti svg{width:18px;height:18px}
.file-row .tt{flex:1;min-width:0}
.file-row .tt strong{font-size:14px;font-weight:600;color:var(--gray-1000);display:block}
.file-row .tt span{font-size:12.5px;color:var(--gray-600)}
.icon-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--gray-300);background:var(--gray-0);
  color:var(--gray-700);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{background:var(--gray-100);border-color:var(--gray-500)}
.icon-btn svg{width:18px;height:18px}
.more-wrap{position:relative}
.more-menu{position:absolute;right:0;top:44px;background:var(--gray-0);border:1px solid var(--gray-300);
  border-radius:10px;box-shadow:var(--sh-lg);padding:6px;min-width:200px;z-index:20}
.more-menu[hidden]{display:none}
.more-menu button{width:100%;text-align:left;font-family:var(--font);font-size:13.5px;color:var(--gray-900);
  background:transparent;border:none;padding:9px 12px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:9px}
.more-menu button:hover{background:var(--gray-100)}
.more-menu svg{width:16px;height:16px;color:var(--gray-600)}

/* toolbar */
.toolbar{display:flex;flex-direction:column;gap:11px;margin-bottom:14px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--gray-500)}
.search input{width:100%;font-family:var(--font);font-size:14px;padding:10px 12px 10px 38px;
  border:1px solid var(--gray-300);border-radius:8px;background:var(--gray-0);color:var(--gray-900)}
.search input:focus{outline:none;border-color:var(--orange-600);box-shadow:0 0 0 3px var(--orange-100)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip-btn{font-family:var(--font);font-size:12.5px;font-weight:500;padding:6px 14px;border-radius:20px;
  cursor:pointer;border:1px solid var(--gray-300);background:var(--gray-0);color:var(--gray-700);transition:all .16s}
.chip-btn:hover{border-color:var(--gray-500)}
.chip-btn.on{background:var(--orange-100);border-color:var(--orange-600);color:var(--orange-800)}

/* table */
.tbl{border:1px solid var(--gray-300);border-radius:12px;overflow:hidden}
.tbl-h,.trow{display:grid;grid-template-columns:1fr 150px;align-items:center}
.tbl-h{padding:12px 20px;background:var(--gray-100);border-bottom:1px solid var(--gray-300)}
.tbl-h span{font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--gray-600)}
.tbl-h span:last-child{text-align:right}
.trow{padding:11px 20px;border-bottom:1px solid var(--gray-200)}
.trow:last-child{border-bottom:none}
.tcell{display:flex;align-items:center;gap:13px;min-width:0}
.inc{display:flex;align-items:center;cursor:pointer;flex-shrink:0;position:relative}
.inc input{position:absolute;opacity:0;width:0;height:0}
.incbox{width:20px;height:20px;border:1.5px solid var(--gray-400);border-radius:5px;display:flex;
  align-items:center;justify-content:center;color:#fff;transition:all .16s}
.incbox svg{width:13px;height:13px}
.inc input:checked+.incbox{background:var(--orange-600);border-color:var(--orange-600)}
.tinfo{min-width:0}
.tname{font-size:15px;font-weight:500;color:var(--gray-1000);display:flex;align-items:center;flex-wrap:wrap}
.tch{font-size:12.5px;color:var(--gray-500);margin-top:1px}
.trow.excluded{background:var(--gray-100)}
.trow.excluded .tname{color:var(--gray-500)}
.trow.excluded .tch{color:var(--gray-400)}
.trow.excluded .binput{background:var(--gray-100);color:var(--gray-400);border-color:var(--gray-200)}
.reason{font-size:11px;font-weight:500;color:var(--yellow-1000);background:var(--yellow-100);
  padding:2px 7px;border-radius:5px;margin-left:8px;white-space:nowrap}
.edited-tag{font-size:11px;font-weight:500;color:var(--orange-700);margin-left:8px}
.binput-wrap{position:relative;justify-self:end;width:140px}
.binput-wrap .dol{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:14px;color:var(--gray-500);pointer-events:none}
.binput{width:100%;font-family:var(--mono);font-size:15px;text-align:right;padding:10px 12px 10px 22px;
  border:1px solid var(--gray-300);border-radius:8px;background:var(--gray-0);color:var(--gray-1000)}
.binput:focus{outline:none;border-color:var(--orange-600);box-shadow:0 0 0 3px var(--orange-100)}
.tbl-foot{display:grid;grid-template-columns:1fr 150px;align-items:center;padding:15px 20px;
  background:var(--gray-100);border-top:1px solid var(--gray-300)}
.tbl-foot .flabel{font-size:14px;font-weight:600;color:var(--gray-1000)}
.tbl-foot .finc{font-weight:400;color:var(--gray-600);font-size:13px}
.tbl-foot .fval{text-align:right;font-family:var(--mono);font-size:17px;font-weight:600;color:var(--gray-1000)}
.empty-row{padding:28px 20px;text-align:center;font-size:13.5px;color:var(--gray-500)}

/* done */
.done-wrap{text-align:center;padding:20px 10px 6px}
.done-ring{width:64px;height:64px;border-radius:50%;background:var(--green-300);color:var(--green-1000);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.done-ring svg{width:32px;height:32px}
.done-wrap h2{margin:0 0 6px;font-size:22px;font-weight:600;color:var(--gray-1000)}
.done-wrap>p{margin:0 0 22px;font-size:14px;color:var(--gray-700)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;text-align:left}
.scard{background:var(--gray-100);border-radius:11px;padding:14px 16px}
.scard .sl{font-size:12px;color:var(--gray-600);margin-bottom:5px}
.scard .sv{font-size:20px;font-weight:600;color:var(--gray-1000);font-family:var(--mono)}
.scard .sv.small{font-size:15px;font-family:var(--font);line-height:1.3}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:22px}
.chip{font-size:12.5px;font-weight:500;background:var(--orange-100);color:var(--orange-800);padding:5px 12px;border-radius:20px}
.back-link{font-size:13px;color:var(--gray-600);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.back-link:hover{color:var(--gray-1000)}
.back-link svg{width:14px;height:14px}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:620px){.methods{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><div id="stage"></div></div>

<script>
const PLAN_PERIODS = [
  {id:"q4",  label:"Q4 2025 · Oct 1 – Dec 31", days:92},
  {id:"nov", label:"November 2025 · Nov 1 – 30", days:30},
  {id:"h2",  label:"Aug – Dec 2025 · Aug 1 – Dec 31", days:153}
];
const CT_GROUPS = [
  {group:"Baseline", sub:"raw conversion types", type:"single", items:[
    {id:"online",  name:"Online Orders",   desc:"Ecommerce conversions"},
    {id:"instore", name:"In-Store Orders", desc:"Retail / brick-and-mortar"},
    {id:"retail",  name:"Retail Orders",   desc:"Wholesale + marketplace"}
  ]},
  {group:"Roll-up", sub:"aggregated across sources", type:"single", items:[
    {id:"omni",  name:"Omni Orders",  desc:"Online + In-Store combined"},
    {id:"total", name:"Total Orders", desc:"All conversion sources"}
  ]},
  {group:"Attributes", sub:"combine multiple", type:"multi", items:[
    {id:"newcust", name:"New Customers",       desc:"First-time buyers"},
    {id:"return",  name:"Returning Customers", desc:"Repeat buyers"},
    {id:"subs",    name:"Subscription Orders", desc:"Recurring revenue"}
  ]}
];
const CT_LOOKUP = {}; CT_GROUPS.forEach(g=>g.items.forEach(i=>CT_LOOKUP[i.id]=i.name));

const TACTICS = [
  {id:"gb",  name:"Google Brand",         ch:"Paid Search"},
  {id:"gnb", name:"Google Non-Brand",     ch:"Paid Search"},
  {id:"mp",  name:"Meta Prospecting",     ch:"Paid Social"},
  {id:"mr",  name:"Meta Retargeting",     ch:"Paid Social"},
  {id:"tt",  name:"TikTok",               ch:"Paid Social", dormant:true},
  {id:"pin", name:"Pinterest",            ch:"Paid Social"},
  {id:"pd",  name:"Programmatic Display", ch:"Display"},
  {id:"cr",  name:"Criteo Retargeting",   ch:"Display", dormant:true},
  {id:"yt",  name:"YouTube",              ch:"Video"}
];
const Q3_92 = {gb:118000,gnb:249000,mp:337000,mr:104000,tt:79000,pin:53000,pd:150000,cr:60000,yt:86000};
const DAILY = {}; TACTICS.forEach(t=>DAILY[t.id]=Q3_92[t.id]/92);
// budget_plan.xlsx as uploaded — Pinterest & YouTube left blank
const XLS_BUDGET = {gb:42000,gnb:88000,mp:120000,mr:36000,tt:28000,pin:null,pd:54000,cr:22000,yt:null};

const fmt = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(d){ return MONTHS[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear(); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
const ANCHOR = new Date(2025,8,30);
const WIN_MULT = [1.00, 0.94, 1.07];
function pastWindows(n){
  return WIN_MULT.map((mult,i)=>{
    const end=addDays(ANCHOR,-i*n), start=addDays(end,-(n-1));
    return {id:"w"+i, mult, start, end, label:fmtDate(start)+" – "+fmtDate(end)+" ("+n+" days)"};
  });
}

const state = {
  screen:"period", plan:"q4",
  singleCT:null, attrs:[],
  method:null, source:"", win:"w0",
  budget:{}, overridden:{}, included:{}, query:"", channel:"All"
};
let focusSearch=false;
function planDays(){ return PLAN_PERIODS.find(p=>p.id===state.plan).days; }

const ICONS = {
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>',
  history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8M8 9h2"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>'
};

/* ---------- screens ---------- */
function screenPeriod(){
  return `<div class="card fade">
    <div class="card-head"><p class="eyebrow">Planning period</p>
      <h1>What period are you planning for?</h1>
      <p>Set the plan's date range first. We'll match its length when pulling past spend.</p></div>
    <div class="card-body">
      <div class="field"><label>Plan period</label>
        <select id="plan-select">${PLAN_PERIODS.map(p=>`<option value="${p.id}" ${state.plan===p.id?'selected':''}>${p.label}</option>`).join("")}</select>
        <span class="daycount" id="plan-days">${planDays()} days</span></div>
    </div>
    <div class="card-foot"><span></span><button class="btn btn-primary btn-lg" id="p-next">Continue</button></div>
  </div>`;
}

function screenCT(){
  const groups = CT_GROUPS.map(g=>{
    const rows=g.items.map(it=>{
      const sel=g.type==="single"?state.singleCT===it.id:state.attrs.includes(it.id);
      return `<div class="opt ${g.type==='single'?'radio':'check'} ${sel?'sel':''}" data-type="${g.type}" data-id="${it.id}">
        <div class="mark">${sel?ICONS.check:''}</div>
        <div class="otext"><div class="otitle">${it.name}</div><div class="odesc">${it.desc}</div></div></div>`;
    }).join("");
    return `<div class="group"><p class="group-label">${g.group} <span class="sub">· ${g.sub}</span></p>${rows}</div>`;
  }).join("");
  const ready=state.singleCT||state.attrs.length;
  return `<div class="card fade">
    <div class="card-head"><p class="eyebrow">Conversion type</p>
      <h1>Select conversion type</h1>
      <p>Pick one baseline or roll-up type, or combine attributes into a custom view.</p></div>
    <div class="card-body">${groups}</div>
    <div class="card-foot"><span class="back-link" data-back="period">${ICONS.back} Back</span>
      <button class="btn btn-primary btn-lg" id="ct-next" ${ready?'':'disabled'}>Continue</button></div>
  </div>`;
}

function screenMethod(){
  return `<div class="card fade">
    <div class="card-head"><p class="eyebrow">Add budget</p>
      <h1>Add budget</h1>
      <p>Bring in spend by tactic from a spreadsheet, or start from a past period's actuals.</p></div>
    <div class="card-body"><div class="methods">
      <button class="method" data-method="upload"><div class="micon">${ICONS.upload}</div>
        <h3>Upload budget</h3><p>Download the template, fill in spend per tactic, and upload it back.</p></button>
      <button class="method" data-method="fetch"><div class="micon">${ICONS.history}</div>
        <h3>Fetch from past period</h3><p>Use a prior period's actual spend as your starting budget.</p></button>
    </div></div>
    <div class="card-foot"><span class="back-link" data-back="ct">${ICONS.back} Back</span><span></span></div>
  </div>`;
}

function screenUpload(){
  const filled=state.source==="upload-ready";
  return `<div class="card fade">
    <div class="card-head"><p class="eyebrow">Add budget · Upload</p>
      <h1>Upload your budget</h1>
      <p>Start from the template so every tactic maps cleanly on the way back in.</p></div>
    <div class="card-body">
      <div class="template-row"><div class="ti">${ICONS.file}</div>
        <div class="tt"><strong>MPO_budget_template.xlsx</strong><span>9 tactics · Tactic, Channel, Budget columns</span></div>
        <button class="btn" id="dl-template">${ICONS.download} Download</button></div>
      <div class="dropzone ${filled?'filled':''}" id="dropzone">
        <div class="dz-icon">${filled?ICONS.check:ICONS.upload}</div>
        <div class="dz-title">${filled?'budget_plan.xlsx uploaded':'Drop your completed .xlsx here'}</div>
        <div class="dz-sub">${filled?'9 of 9 tactics matched':'or click to browse'}</div></div>
    </div>
    <div class="card-foot"><span class="back-link" data-back="method">${ICONS.back} Back</span>
      <button class="btn btn-primary btn-lg" id="up-next" ${filled?'':'disabled'}>Review tactics</button></div>
  </div>`;
}

function buildFromWindow(){
  const n=planDays();
  const w=pastWindows(n).find(x=>x.id===state.win)||pastWindows(n)[0];
  TACTICS.forEach(t=>{ if(!state.overridden[t.id]) state.budget[t.id]= t.dormant?0:Math.round(DAILY[t.id]*n*w.mult); });
  return w;
}
function buildFromXls(){ TACTICS.forEach(t=>{ state.budget[t.id]=XLS_BUDGET[t.id]; }); state.source="budget_plan.xlsx"; }
function setDefaultIncludes(){
  TACTICS.forEach(t=>{
    if(state.method==="upload") state.included[t.id] = state.budget[t.id]!=null && state.budget[t.id]>0;
    else state.included[t.id] = !t.dormant;
  });
}

function channelsPresent(){ const s=[]; TACTICS.forEach(t=>{ if(!s.includes(t.ch)) s.push(t.ch); }); return s; }
function visibleTactics(){
  const q=state.query.trim().toLowerCase();
  return TACTICS.filter(t=>(state.channel==="All"||t.ch===state.channel)&&t.name.toLowerCase().includes(q));
}
function includedCount(){ return TACTICS.filter(t=>state.included[t.id]).length; }
function includedTotal(){ return TACTICS.reduce((n,t)=>n+((state.included[t.id]&&state.budget[t.id])?state.budget[t.id]:0),0); }

function reviewRows(){
  const rows=visibleTactics();
  if(rows.length===0) return `<div class="empty-row">No tactics match your search or filter.</div>`;
  return rows.map(t=>{
    const inc=state.included[t.id], v=state.budget[t.id], edited=state.overridden[t.id];
    let reason="";
    if(!inc){
      if(state.method==="upload"&&(v==null||v===0)) reason=`<span class="reason">no budget in file</span>`;
      else if(state.method==="fetch"&&t.dormant) reason=`<span class="reason">no spend in 12+ mo</span>`;
    }
    return `<div class="trow ${inc?'':'excluded'}">
      <div class="tcell">
        <label class="inc"><input type="checkbox" data-inc="${t.id}" ${inc?'checked':''} /><span class="incbox">${inc?ICONS.check:''}</span></label>
        <div class="tinfo"><div class="tname">${t.name}${edited&&inc?`<span class="edited-tag">edited</span>`:''}${reason}</div><div class="tch">${t.ch}</div></div>
      </div>
      <div class="binput-wrap"><span class="dol">$</span><input class="binput" data-b="${t.id}" value="${v!=null?v.toLocaleString('en-US'):''}" inputmode="numeric" ${inc?'':'disabled'} /></div>
    </div>`;
  }).join("");
}

function screenReview(){
  const n=planDays();
  let topBlock;
  if(state.method==="fetch"){
    const w=buildFromWindow(), wins=pastWindows(n);
    topBlock=`<div class="src-panel">
      <div class="period-bar"><div class="pb-ico">${ICONS.history}</div><label>Source period</label>
        <select id="win-select">${wins.map(x=>`<option value="${x.id}" ${state.win===x.id?'selected':''}>${x.label}</option>`).join("")}</select></div>
      <div class="period-note">${ICONS.info}<span>Actual spend from ${fmtDate(w.start)} – ${fmtDate(w.end)} — the same ${n} days as your plan. Tactics with no spend in the last year are excluded by default.</span></div>
    </div>`;
  } else {
    topBlock=`<div class="file-row"><div class="ti">${ICONS.check}</div>
      <div class="tt"><strong>${state.source}</strong><span>Tactics with no budget in the file are excluded by default</span></div>
      <button class="btn" id="reupload">${ICONS.upload} Reupload</button>
      <div class="more-wrap"><button class="icon-btn" id="more-btn" aria-label="More options">${ICONS.more}</button>
        <div class="more-menu" id="more-menu" hidden><button data-act="dl">${ICONS.download} Download template</button></div></div>
    </div>`;
  }
  const toolbar=`<div class="toolbar">
    <div class="search">${ICONS.search}<input id="rev-search" placeholder="Search tactics" value="${state.query}" /></div>
    <div class="chips">${["All",...channelsPresent()].map(c=>`<button class="chip-btn ${state.channel===c?'on':''}" data-ch="${c}">${c}</button>`).join("")}</div>
  </div>`;
  return `<div class="card fade">
    <div class="card-head"><p class="eyebrow">Review budget</p>
      <h1>Review plan budget</h1>
      <p>Include the tactics you want, adjust budgets, then create the plan.</p></div>
    <div class="card-body">
      ${topBlock}
      ${toolbar}
      <div class="tbl"><div class="tbl-h"><span>Tactic</span><span>Budget</span></div>${reviewRows()}
        <div class="tbl-foot"><span class="flabel">Total budget <span class="finc">· ${includedCount()} of ${TACTICS.length} included</span></span>
          <span class="fval" id="rev-total">${fmt.format(includedTotal())}</span></div></div>
    </div>
    <div class="card-foot"><span class="back-link" data-back="${state.method==='upload'?'upload':'method'}">${ICONS.back} Back</span>
      <button class="btn btn-primary btn-lg" id="rev-create">Create plan</button></div>
  </div>`;
}

function screenDone(){
  const total=includedTotal(), active=includedCount();
  const period=PLAN_PERIODS.find(p=>p.id===state.plan).label.split(" · ")[0];
  const usingAttrs=state.attrs.length>0;
  const ctLabel=usingAttrs?"Combined attribute":CT_LOOKUP[state.singleCT];
  return `<div class="card fade"><div class="card-body"><div class="done-wrap">
    <div class="done-ring">${ICONS.check}</div>
    <h2>Plan created</h2><p>Your draft plan is ready to project and simulate.</p>
    <div class="summary">
      <div class="scard"><div class="sl">Plan period</div><div class="sv small">${period}</div></div>
      <div class="scard"><div class="sl">Conversion type</div><div class="sv small">${ctLabel}</div></div>
      <div class="scard"><div class="sl">Tactics included</div><div class="sv">${active}</div></div>
      <div class="scard"><div class="sl">Total budget</div><div class="sv">${fmt.format(total)}</div></div>
    </div>
    ${usingAttrs?`<div class="chip-row">${state.attrs.map(id=>`<span class="chip">${CT_LOOKUP[id]}</span>`).join("")}</div>`:''}
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn" id="restart">Start over</button>
      <button class="btn btn-primary btn-lg" id="tosim">Project &amp; simulate →</button></div>
  </div></div></div>`;
}

/* ---------- render + events ---------- */
function render(){
  const map={period:screenPeriod,ct:screenCT,method:screenMethod,upload:screenUpload,review:screenReview,done:screenDone};
  document.getElementById("stage").innerHTML=map[state.screen]();
  wire();
  if(focusSearch){ const se=document.getElementById("rev-search"); if(se){ se.focus(); const v=se.value; se.setSelectionRange(v.length,v.length);} focusSearch=false; }
}
function updateTotal(){ const el=document.getElementById("rev-total"); if(el) el.textContent=fmt.format(includedTotal()); }

function wire(){
  const s=state.screen;
  document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{ state.screen=b.dataset.back; render(); });

  if(s==="period"){
    document.getElementById("plan-select").onchange=e=>{ state.plan=e.target.value; document.getElementById("plan-days").textContent=planDays()+" days"; };
    document.getElementById("p-next").onclick=()=>{ state.screen="ct"; render(); };
  }
  if(s==="ct"){
    document.querySelectorAll("[data-id]").forEach(r=>r.onclick=()=>{
      const id=r.dataset.id,type=r.dataset.type;
      if(type==="single"){ state.singleCT=state.singleCT===id?null:id; state.attrs=[]; }
      else { state.singleCT=null; state.attrs.includes(id)?state.attrs=state.attrs.filter(x=>x!==id):state.attrs.push(id); }
      render();
    });
    document.getElementById("ct-next").onclick=()=>{ state.screen="method"; render(); };
  }
  if(s==="method"){
    document.querySelectorAll("[data-method]").forEach(m=>m.onclick=()=>{
      state.method=m.dataset.method; state.overridden={}; state.budget={}; state.win="w0"; state.source="";
      state.included={}; state.query=""; state.channel="All";
      if(m.dataset.method==="upload"){ state.screen="upload"; }
      else { buildFromWindow(); setDefaultIncludes(); state.screen="review"; }
      render();
    });
  }
  if(s==="upload"){
    document.getElementById("dl-template").onclick=downloadTemplate;
    document.getElementById("dropzone").onclick=()=>{ state.source="upload-ready"; render(); };
    const nx=document.getElementById("up-next");
    if(nx) nx.onclick=()=>{ buildFromXls(); setDefaultIncludes(); state.query=""; state.channel="All"; state.screen="review"; render(); };
  }
  if(s==="review"){
    const ws=document.getElementById("win-select");
    if(ws) ws.onchange=e=>{ state.win=e.target.value; state.overridden={}; render(); };
    const ru=document.getElementById("reupload");
    if(ru) ru.onclick=()=>{ state.screen="upload"; state.source=""; render(); };
    const mb=document.getElementById("more-btn"), mm=document.getElementById("more-menu");
    if(mb) mb.onclick=e=>{ e.stopPropagation(); mm.hidden=!mm.hidden; };
    if(mm) mm.querySelector("[data-act='dl']").onclick=()=>{ downloadTemplate(); mm.hidden=true; };
    const se=document.getElementById("rev-search");
    se.oninput=()=>{ state.query=se.value; focusSearch=true; render(); };
    document.querySelectorAll("[data-ch]").forEach(c=>c.onclick=()=>{ state.channel=c.dataset.ch; render(); });
    document.querySelectorAll("[data-inc]").forEach(cb=>cb.onchange=()=>{ state.included[cb.dataset.inc]=cb.checked; render(); });
    document.getElementById("rev-create").onclick=()=>{ state.screen="done"; render(); };
    document.querySelectorAll("[data-b]").forEach(inp=>{
      inp.oninput=()=>{ const nn=parseInt(inp.value.replace(/[^0-9]/g,''),10); state.budget[inp.dataset.b]=isNaN(nn)?null:nn; state.overridden[inp.dataset.b]=true; updateTotal(); };
      inp.onblur=()=>{ const v=state.budget[inp.dataset.b]; inp.value=v!=null?v.toLocaleString('en-US'):''; };
    });
  }
  if(s==="done"){
    document.getElementById("restart").onclick=()=>{
      Object.assign(state,{screen:"period",plan:"q4",singleCT:null,attrs:[],method:null,source:"",win:"w0",budget:{},overridden:{},included:{},query:"",channel:"All"});
      render();
    };
    document.getElementById("tosim").onclick=()=>alert("→ hands off to Project & simulate (next step in the MPO journey)");
  }
}

document.addEventListener("click",e=>{ const mm=document.getElementById("more-menu"); if(mm&&!mm.hidden&&!e.target.closest(".more-wrap")) mm.hidden=true; });

function downloadTemplate(){
  let csv="Tactic,Channel,Budget\n";
  TACTICS.forEach(t=>{ csv+=`${t.name},${t.ch},\n`; });
  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="MPO_budget_template.csv"; a.click();
  URL.revokeObjectURL(a.href);
}

render();
</script>
</body>
</html>
